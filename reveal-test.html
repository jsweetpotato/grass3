<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading Transition Test</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      #scene {
        position: fixed;
        inset: 0;
        background: linear-gradient(160deg, #2d5a3d, #0d1f16);
      }
      #loading {
        position: fixed;
        inset: 0;
        z-index: 10;
        color: #fff;
        font-family: system-ui, sans-serif;
        pointer-events: none;
      }
      .scrim1 {
        position: absolute;
        inset: 0;
        background: url(./public/images/paper.webp) no-repeat center / cover;
        opacity: 0.3;
        mix-blend-mode: overlay;
        transition: opacity 0.75s cubic-bezier(0.23, 1, 0.32, 1);
      }
      .scrim2 {
        position: absolute;
        inset: 0;
        opacity: 1;
        background: #a29987;
        transition: opacity 0.75s cubic-bezier(0.23, 1, 0.32, 1);
      }
      .ui {
        position: relative;
        z-index: 1;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        perspective: 600px;
      }
      #art {
        width: 100%;
        max-width: 420px;
        transform: translateZ(0);
        transform-style: preserve-3d;
        transition:
          opacity 1.4s cubic-bezier(0.23, 1, 0.32, 1),
          transform 1.4s cubic-bezier(0.23, 1, 0.32, 1);
      }

      /* done: scrim 먼저 → grass hold → z + fade */
      #loading.reveal .scrim1,
      #loading.reveal .scrim2 {
        opacity: 0;
      }
      #loading.reveal #art {
        opacity: 0;
        transform: translateZ(100px);
        transition-delay: 0.45s;
      }
    </style>
  </head>
  <body>
    <div id="scene"></div>

    <div id="loading">
      <div class="scrim2"></div>
      <div class="scrim1"></div>
      <div class="ui">
        <svg id="art" viewBox="18 28 235 88" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <filter id="wob" x="-20%" y="-20%" width="140%" height="140%">
              <feTurbulence
                type="fractalNoise"
                baseFrequency="0.025 0.04"
                numOctaves="2"
                seed="3"
                result="n"
              >
                <animate
                  attributeName="seed"
                  from="1"
                  to="18"
                  dur="0.45s"
                  repeatCount="indefinite"
                  calcMode="discrete"
                />
              </feTurbulence>
              <feDisplacementMap
                in="SourceGraphic"
                in2="n"
                scale="4"
                xChannelSelector="R"
                yChannelSelector="G"
              />
            </filter>
          </defs>
          <g
            id="letters"
            filter="url(#wob)"
            fill="none"
            stroke="#fff"
            stroke-width="6"
            stroke-linecap="round"
            stroke-linejoin="round"
            transform="translate(-6 0)"
          >
            <path
              d="M92 52 Q80 34 58 36 Q34 38 30 66 Q26 96 52 100 Q76 103 82 80 Q84 72 74 72 L62 72"
            />
            <path d="M107 60 L109 102 M109 76 Q113 60 129 60" />
            <path
              d="M162 67 Q148 57 138 67 Q128 79 136 91 Q144 101 158 93 Q164 89 162 73 L162 99"
            />
            <path
              d="M203 68 Q189 60 181 68 Q175 76 189 82 Q203 88 197 96 Q189 104 175 96"
            />
            <path
              d="M242 68 Q228 60 220 68 Q214 76 228 82 Q242 88 236 96 Q228 104 214 96"
            />
          </g>
        </svg>
      </div>
    </div>

    <script>
      const loading = document.querySelector("#loading");
      const art = document.querySelector("#art");
      const paths = [...document.querySelectorAll("#letters path")];
      const lens = paths.map((p) => p.getTotalLength());
      const total = lens.reduce((a, b) => a + b, 0);

      paths.forEach((p, i) => {
        p.style.strokeDasharray = p.style.strokeDashoffset = lens[i];
      });

      function drawLetters(pr) {
        let left = total * pr;
        paths.forEach((path, i) => {
          path.style.strokeDashoffset =
            lens[i] - Math.max(0, Math.min(lens[i], left));
          left -= lens[i];
        });
      }

      function finish() {
        loading.classList.add("reveal");
        art.addEventListener(
          "transitionend",
          (e) => {
            if (e.propertyName === "opacity") loading.style.display = "none";
          },
          { once: true },
        );
      }

      let v = 0;
      const tick = setInterval(() => {
        drawLetters(Math.min(++v, 100) / 100);
        if (v >= 100) {
          clearInterval(tick);
          setTimeout(finish, 400); // 완성된 글자 잠깐 hold
        }
      }, 30);
    </script>
  </body>
</html>
